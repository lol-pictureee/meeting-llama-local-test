<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Summarizer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>📝 AI Meeting Summarizer</h1>
        <p class="subtitle">Локальный сервис анализа встреч (Go + Ollama + Whisper)</p>
        <div id="status-bar" class="status-bar">
            <span id="connection-status" class="status-indicator disconnected"></span>
            <span id="connection-text">Подключение...</span>
        </div>
    </header>

    <main>
        <!-- Upload Section -->
        <section class="upload-section">
            <h2>Загрузить аудиозапись</h2>
            <form id="upload-form">
                <div class="file-drop-area" id="drop-zone">
                    <p id="drop-text">Перетащите файл сюда или нажмите для выбора</p>
                    <input type="file" id="file-input" accept=".wav,.mp3,.m4a,.mp4,.webm" hidden>
                </div>
                <button type="submit" id="upload-btn" disabled>Загрузить и обработать</button>
            </form>
            <div id="upload-progress" class="progress-bar" style="display:none;"></div>
        </section>

        <!-- Meetings List -->
        <section class="list-section">
            <div class="section-header">
                <h2>Мои встречи</h2>
                <button id="refresh-btn" class="btn-secondary">🔄 Обновить</button>
            </div>
            <table id="meetings-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя файла</th>
                        <th>Размер</th>
                        <th>Статус</th>
                        <th>Дата</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="meetings-list">
                    <tr><td colspan="6" class="empty-row">Загрузка...</td></tr>
                </tbody>
            </table>
        </section>

        <!-- Meeting Detail Modal -->
        <div id="modal-overlay" class="modal-overlay" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title">Детали встречи</h3>
                    <button id="close-modal" class="btn-close">×</button>
                </div>
                <div id="modal-body" class="modal-body">
                    <div class="modal-loading">Загрузка данных...</div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
